<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">VCT progressive timeout participation probability</title>
  <desc id="desc">Participation probability remains one eighth until 20 seconds of raw elapsed time, then increases exponentially and reaches one at 75 seconds.</desc>
  <rect width="900" height="540" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; fill: #202124; }
    .axis { stroke: #30343b; stroke-width: 1.5; }
    .grid { stroke: #d9dde3; stroke-width: 1; }
    .guide { stroke: #7a8089; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .curve { fill: none; stroke: #1769aa; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    .area { fill: url(#areaGradient); opacity: 0.32; }
    .point { fill: #1769aa; stroke: #ffffff; stroke-width: 2; }
    .small { font-size: 13px; }
    .label { font-size: 15px; font-weight: 600; }
    .title { font-size: 21px; font-weight: 700; }
  </style>
  <defs>
    <linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fa3e3"/>
      <stop offset="100%" stop-color="#dceefb"/>
    </linearGradient>
  </defs>

  <text x="450" y="28" text-anchor="middle" class="title">블록 생성 후 경과 시간에 따른 채굴 참여 확률</text>
  <text x="450" y="50" text-anchor="middle" class="small">기본 확률 1/8, 미래 시각 허용 5초, 유효 경과 시간 70초에 완전 개방</text>

  <!-- Horizontal grid -->
  <line x1="90" y1="430" x2="830" y2="430" class="grid"/>
  <line x1="90" y1="385" x2="830" y2="385" class="grid"/>
  <line x1="90" y1="340" x2="830" y2="340" class="grid"/>
  <line x1="90" y1="250" x2="830" y2="250" class="grid"/>
  <line x1="90" y1="160" x2="830" y2="160" class="grid"/>
  <line x1="90" y1="70" x2="830" y2="70" class="grid"/>

  <!-- Vertical grid -->
  <line x1="90" y1="70" x2="90" y2="430" class="grid"/>
  <line x1="188.7" y1="70" x2="188.7" y2="430" class="grid"/>
  <line x1="287.3" y1="70" x2="287.3" y2="430" class="guide"/>
  <line x1="386" y1="70" x2="386" y2="430" class="grid"/>
  <line x1="484.7" y1="70" x2="484.7" y2="430" class="grid"/>
  <line x1="583.3" y1="70" x2="583.3" y2="430" class="grid"/>
  <line x1="682" y1="70" x2="682" y2="430" class="grid"/>
  <line x1="780.7" y1="70" x2="780.7" y2="430" class="grid"/>
  <line x1="830" y1="70" x2="830" y2="430" class="guide"/>

  <!-- Area and curve -->
  <path class="area" d="M 90 430 L 90.0 385.0 L 99.9 385.0 L 109.7 385.0 L 119.6 385.0 L 129.5 385.0 L 139.3 385.0 L 149.2 385.0 L 159.1 385.0 L 168.9 385.0 L 178.8 385.0 L 188.7 385.0 L 198.5 385.0 L 208.4 385.0 L 218.3 385.0 L 228.1 385.0 L 238.0 385.0 L 247.9 385.0 L 257.7 385.0 L 267.6 385.0 L 277.5 385.0 L 287.3 385.0 L 297.2 383.3 L 307.1 381.5 L 316.9 379.6 L 326.8 377.7 L 336.7 375.6 L 346.5 373.5 L 356.4 371.4 L 366.3 369.1 L 376.1 366.8 L 386.0 364.3 L 395.9 361.8 L 405.7 359.2 L 415.6 356.4 L 425.5 353.6 L 435.3 350.7 L 445.2 347.6 L 455.1 344.4 L 464.9 341.1 L 474.8 337.7 L 484.7 334.1 L 494.5 330.5 L 504.4 326.6 L 514.3 322.6 L 524.1 318.5 L 534.0 314.2 L 543.9 309.7 L 553.7 305.1 L 563.6 300.3 L 573.5 295.3 L 583.3 290.1 L 593.2 284.7 L 603.1 279.1 L 612.9 273.3 L 622.8 267.3 L 632.7 261.0 L 642.5 254.5 L 652.4 247.7 L 662.3 240.7 L 672.1 233.4 L 682.0 225.8 L 691.9 218.0 L 701.7 209.8 L 711.6 201.3 L 721.5 192.5 L 731.3 183.3 L 741.2 173.8 L 751.1 164.0 L 760.9 153.7 L 770.8 143.1 L 780.7 132.0 L 790.5 120.5 L 800.4 108.6 L 810.3 96.2 L 820.1 83.4 L 830.0 70.0 L 830 430 Z"/>
  <path class="curve" d="M 90.0 385.0 L 99.9 385.0 L 109.7 385.0 L 119.6 385.0 L 129.5 385.0 L 139.3 385.0 L 149.2 385.0 L 159.1 385.0 L 168.9 385.0 L 178.8 385.0 L 188.7 385.0 L 198.5 385.0 L 208.4 385.0 L 218.3 385.0 L 228.1 385.0 L 238.0 385.0 L 247.9 385.0 L 257.7 385.0 L 267.6 385.0 L 277.5 385.0 L 287.3 385.0 L 297.2 383.3 L 307.1 381.5 L 316.9 379.6 L 326.8 377.7 L 336.7 375.6 L 346.5 373.5 L 356.4 371.4 L 366.3 369.1 L 376.1 366.8 L 386.0 364.3 L 395.9 361.8 L 405.7 359.2 L 415.6 356.4 L 425.5 353.6 L 435.3 350.7 L 445.2 347.6 L 455.1 344.4 L 464.9 341.1 L 474.8 337.7 L 484.7 334.1 L 494.5 330.5 L 504.4 326.6 L 514.3 322.6 L 524.1 318.5 L 534.0 314.2 L 543.9 309.7 L 553.7 305.1 L 563.6 300.3 L 573.5 295.3 L 583.3 290.1 L 593.2 284.7 L 603.1 279.1 L 612.9 273.3 L 622.8 267.3 L 632.7 261.0 L 642.5 254.5 L 652.4 247.7 L 662.3 240.7 L 672.1 233.4 L 682.0 225.8 L 691.9 218.0 L 701.7 209.8 L 711.6 201.3 L 721.5 192.5 L 731.3 183.3 L 741.2 173.8 L 751.1 164.0 L 760.9 153.7 L 770.8 143.1 L 780.7 132.0 L 790.5 120.5 L 800.4 108.6 L 810.3 96.2 L 820.1 83.4 L 830.0 70.0"/>

  <!-- Key points -->
  <circle cx="287.3" cy="385" r="6" class="point"/>
  <circle cx="583.3" cy="290.1" r="6" class="point"/>
  <circle cx="830" cy="70" r="6" class="point"/>

  <!-- Axes -->
  <line x1="90" y1="430" x2="838" y2="430" class="axis"/>
  <line x1="90" y1="438" x2="90" y2="62" class="axis"/>

  <!-- Y labels -->
  <text x="78" y="435" text-anchor="end" class="small">0</text>
  <text x="78" y="390" text-anchor="end" class="small">0.125</text>
  <text x="78" y="345" text-anchor="end" class="small">0.25</text>
  <text x="78" y="255" text-anchor="end" class="small">0.50</text>
  <text x="78" y="165" text-anchor="end" class="small">0.75</text>
  <text x="78" y="75" text-anchor="end" class="small">1.00</text>

  <!-- X labels -->
  <text x="90" y="452" text-anchor="middle" class="small">0</text>
  <text x="188.7" y="452" text-anchor="middle" class="small">10</text>
  <text x="287.3" y="452" text-anchor="middle" class="small">20</text>
  <text x="386" y="452" text-anchor="middle" class="small">30</text>
  <text x="484.7" y="452" text-anchor="middle" class="small">40</text>
  <text x="583.3" y="452" text-anchor="middle" class="small">50</text>
  <text x="682" y="452" text-anchor="middle" class="small">60</text>
  <text x="780.7" y="452" text-anchor="middle" class="small">70</text>
  <text x="830" y="452" text-anchor="middle" class="small">75</text>

  <!-- Axis titles -->
  <text x="460" y="486" text-anchor="middle" class="label">부모 블록 생성 후 원시 경과 시간 Δt_raw (초)</text>
  <text x="22" y="250" text-anchor="middle" class="label" transform="rotate(-90 22 250)">계정별 채굴 참여 확률 p</text>

  <!-- Annotations -->
  <text x="190" y="365" text-anchor="middle" class="label">기본 확률 1/8 유지</text>
  <text x="287.3" y="103" text-anchor="middle" class="label">확률 증가 시작</text>
  <text x="287.3" y="122" text-anchor="middle" class="small">raw 20초 = effective 15초</text>
  <text x="705" y="102" text-anchor="middle" class="label">지수적으로 참여 범위 확대</text>
  <text x="822" y="95" text-anchor="end" class="label">p = 1</text>
  <text x="822" y="114" text-anchor="end" class="small">raw 75초 = effective 70초</text>

  <text x="450" y="520" text-anchor="middle" class="small">p(Δt_eff) = 1/8 · exp((Δt_eff - 15) / (55 / ln 8)), 15 ≤ Δt_eff &lt; 70</text>
</svg>
